<text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#19314b">Администратор: role = admin, student_id = NULL, teacher_id = NULL.</text>
<text x="60" y="1233" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#19314b">Пунктир — необязательная связь с учётной записью. Прочие поля — NOT NULL.</text>
<text x="60" y="1271" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#19314b">ATTENDANCE: UNIQUE (lesson_id, student_id); статусы present / absent / excused.</text>
